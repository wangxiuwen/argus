<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira</title>
<style>
  :root {
    --bg: #ffffff; --side: #f7f7f8; --text: #18181b; --muted: #85858d;
    --border: #e8e8eb; --field: #f5f5f7; --hover: #ececef;
    --user-bubble: #f0f0f3; --send: #18181b; --send-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1e; --side: #141416; --text: #ececf0; --muted: #8e8e97;
      --border: #2b2b31; --field: #26262b; --hover: #303038;
      --user-bubble: #2c2c33; --send: #ececf0; --send-text: #18181b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex;
    font: 14.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* sidebar */
  #side {
    width: 226px; flex: none; background: var(--side); border-right: 1px solid var(--border);
    padding: 10px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  #side.hidden { display: none; }
  #sideTop { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 8px; margin-bottom: 5px; }
  .brand-eye { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg,#4f46e5,#a855f7); box-shadow: inset 0 0 0 1px #fff3, 0 4px 12px #6d5bea25; }
  .brand-eye svg { width: 15px; height: 15px; }
  .brand-name { font-weight: 650; letter-spacing: -.01em; }
  #sideTop .icon-btn { margin-left: auto; }
  .icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 5px; border-radius: 7px; line-height: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; display: block; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  #toggleOut { display: none; }
  body.side-hidden #toggleOut { display: block; }
  .side-btn {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px;
    background: none; border: none; color: var(--text); font: inherit; text-align: left;
    cursor: pointer; width: 100%;
  }
  .side-btn:hover { background: var(--hover); }
  .side-btn .ic { width: 18px; display: flex; justify-content: center; opacity: .8; }
  .side-btn .ic svg { width: 17px; height: 17px; }
  #side .label { color: var(--muted); font-size: 11px; padding: 12px 10px 4px; letter-spacing: .03em; }
  #chats { overflow-y: auto; flex: 1; margin: 0 -2px; }
  .chat-row {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px;
  }
  .chat-row:hover { background: var(--hover); }
  .chat-row.cur { background: var(--hover); }
  .chat-row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row .del {
    opacity: 0; border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 0 2px; flex: none;
  }
  .chat-row:hover .del { opacity: 1; }
  #side .foot { color: var(--muted); font-size: 11.5px; padding: 6px 10px; border-top: 1px solid var(--border); }
  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #bar {
    height: 50px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 17px; border-bottom: 1px solid var(--border); -webkit-app-region: drag;
  }
  #moduleTitle { font-weight: 580; letter-spacing: -.01em; }
  #status { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: #c9c9cf; }
  #dot.ok { background: #22c55e; }
  #log { flex: 1; overflow-y: auto; padding: 20px 24px 12px; }
  /* Launch view: point other tools at the local API */
  #launch { flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: none; }
  #launch .wrap { max-width: 700px; margin: 0 auto; }
  #launch h2 { font-size: 21px; margin: 8px 0 4px; }
  #launch .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .card:last-child { border-bottom: none; }
  .card .logo {
    width: 38px; height: 38px; border-radius: 10px; background: var(--field); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .cmd {
    display: flex; align-items: center; gap: 8px; background: var(--field);
    border-radius: 9px; padding: 8px 10px;
  }
  .cmd code {
    flex: 1; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-x: auto; white-space: pre; color: var(--text);
  }
  .copy {
    border: none; background: none; color: var(--muted); cursor: pointer; flex: none;
    padding: 3px 5px; border-radius: 6px; font-size: 12px;
  }
  .copy:hover { background: var(--hover); color: var(--text); }
  body.launching #log, body.launching #composer { display: none; }
  body.launching #launch { display: block; }
  .shortcut { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #log.empty { display: flex; align-items: center; justify-content: center; }
  #hero { width: min(560px,100%); text-align: center; color: var(--muted); padding-bottom: 90px; }
  #hero .hero-eye { width: 50px; height: 50px; border-radius: 16px; margin: 0 auto 17px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg,#4f46e5,#a855f7); box-shadow: 0 10px 26px #6d5bea35; }
  #hero .hero-eye svg { width: 27px; height: 27px; }
  #hero h1 { color: var(--text); font-size: 24px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -.025em; }
  #hero .t { font-size: 13px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 25px; text-align: left; }
  .suggestion { min-height: 58px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 11px; padding: 11px 13px; cursor: pointer; line-height: 1.4; }
  .suggestion:hover { background: var(--field); }
  .msg { max-width: 820px; margin: 0 auto 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
  .user .bubble { background: var(--user-bubble); }
  .bot .bubble { padding-left: 0; padding-right: 0; max-width: 100%; flex: 1; min-width: 0; }
  .bubble img { max-width: 240px; max-height: 240px; border-radius: 10px; display: block; margin-bottom: 6px; }
  .bubble .generated-image { max-width: min(680px,100%); max-height: 680px; border: 1px solid var(--border); }
  .bubble video { display: block; width: min(680px,100%); aspect-ratio: 16/9; border-radius: 12px; background: #09090b; }
  .bubble audio { display: block; width: min(680px,100%); margin-top: 8px; }
  .media-card { width: min(680px,100%); border: 1px solid var(--border); border-radius: 13px; padding: 12px; background: var(--field); }
  .media-card .media-title { font-weight: 600; margin-bottom: 7px; }
  .media-progress { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12.5px; }
  .media-progress progress { width: 150px; accent-color: #7c3aed; }
  .media-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .media-download {
    border: 1px solid var(--border); border-radius: 9px; padding: 6px 11px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .media-download:hover { background: var(--hover); }
  .media-download:disabled { color: var(--muted); cursor: default; }
  .task-card { width: min(680px,100%); margin-top: 10px; border: 1px solid var(--border); border-radius: 13px; padding: 12px; background: var(--field); }
  .task-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .task-head .task-state { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }
  .task-progress { display: flex; align-items: center; gap: 9px; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
  .task-progress progress { flex: 1; accent-color: #7c3aed; }
  .task-actions { display: flex; gap: 7px; margin-top: 9px; }
  .task-output { margin-top: 9px; }
  .bubble details { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .bubble details pre { white-space: pre-wrap; margin: 4px 0 0; font: inherit; }
  .meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 7px; }
  /* composer card */
  #composer { padding: 12px 22px 18px; background: linear-gradient(transparent,var(--bg) 18%); }
  #card {
    max-width: 820px; margin: 0 auto; background: var(--field); border: 1px solid var(--border);
    border-radius: 15px; padding: 11px 12px 10px; box-shadow: 0 7px 25px #0000000b;
  }
  #thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #thumbs:empty { display: none; }
  .thumb { position: relative; }
  .thumb img { height: 54px; border-radius: 8px; }
  .thumb button {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--text); color: var(--bg); font-size: 10px; line-height: 1; cursor: pointer; padding: 0;
  }
  #input {
    width: 100%; border: none; background: none; color: var(--text); font: inherit;
    resize: none; outline: none; min-height: 42px; max-height: 200px; padding: 3px 4px 10px;
  }
  #input::placeholder { color: var(--muted); }
  #tools { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .agent-mode {
    height: 30px; display: inline-flex; align-items: center; border-radius: 15px;
    background: var(--hover); color: var(--muted); padding: 0 10px; font-size: 13px;
    white-space: nowrap;
  }
  .send-shortcut { margin-left: auto; }
  #lyrics { display: none; width: 100%; min-height: 74px; resize: vertical; border: 0; border-top: 1px solid var(--border); outline: 0; background: transparent; color: var(--text); font: inherit; padding: 8px 4px 5px; }
  #lyrics.show { display: block; }
  .round {
    width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--hover);
    color: var(--text); font-size: 15px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  #think {
    display: flex; align-items: center; gap: 5px; border: none; border-radius: 15px;
    background: var(--hover); color: var(--muted); font: inherit; font-size: 13px;
    padding: 6px 11px; cursor: pointer; flex: none;
  }
  #think.on { background: var(--send); color: var(--send-text); }
  #think svg { width: 14px; height: 14px; }
  #picker { position: relative; margin-left: auto; }
  #pickerBtn {
    display: flex; align-items: center; gap: 6px; border: none; border-radius: 15px;
    background: var(--hover); color: var(--text); font: inherit; font-size: 13px;
    padding: 6px 11px; cursor: pointer; max-width: 260px;
  }
  #pickerBtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pickerBtn .caret { opacity: .5; font-size: 10px; }
  #menu {
    position: absolute; bottom: calc(100% + 8px); right: 0; width: 300px; z-index: 20;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 8px; display: none;
  }
  #menu.open { display: block; }
  #find {
    width: 100%; border: none; border-bottom: 1px solid var(--border); background: none;
    color: var(--text); font: inherit; font-size: 13px; padding: 5px 6px 8px; outline: none; margin-bottom: 6px;
  }
  #list { max-height: 240px; overflow-y: auto; }
  .opt {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
    cursor: pointer; font-size: 13px;
  }
  .opt:hover { background: var(--hover); }
  .opt.cur { background: var(--hover); }
  .opt .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .mark { color: var(--muted); font-size: 12px; flex: none; }
  .opt-label { color: var(--muted); font-size: 11px; padding: 8px 8px 3px; }
  #menu { width: 340px; }
  #send {
    width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--send);
    color: var(--send-text); font-size: 14px; cursor: pointer; flex: none;
  }
  #send:disabled { opacity: .35; cursor: default; }
  @media (max-width: 760px) {
    #composer { padding-left: 12px; padding-right: 12px; }
    #modeHint, .send-shortcut { display: none; }
    #pickerBtn { max-width: 180px; }
  }
  /* waiting indicator: pulsing dots + elapsed seconds until the first token lands */
  .waiting {
    display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--field);
  }
  .waiting .stage { color: var(--text); }
  .waiting .secs { min-width: 42px; text-align: right; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    animation: blink 1.2s infinite ease-in-out both;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  body.drag::after {
    content: "Drop image to attach"; position: fixed; inset: 0; z-index: 50;
    background: rgba(120,120,140,.14); border: 2px dashed var(--muted);
    display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 16px;
  }
</style>
</head>
<body>
<nav id="side">
  <div id="sideTop">
    <span class="brand-eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.8 12s3.5-5.1 9.2-5.1 9.2 5.1 9.2 5.1-3.5 5.1-9.2 5.1S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span>
    <span class="brand-name">Mira</span>
    <button class="icon-btn" id="toggleIn" title="Collapse sidebar">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <rect x="2.2" y="3.4" width="15.6" height="13.2" rx="2.6"/>
        <line x1="7.9" y1="3.4" x2="7.9" y2="16.6"/>
      </svg>
    </button>
  </div>
  <button class="side-btn" id="newChat">
    <span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16h9A1.5 1.5 0 0 0 16 14.5V10"/><path d="M13.4 3.6a1.4 1.4 0 0 1 2 2L10.6 10.4l-2.6.6.6-2.6z"/></svg></span>新对话
  </button>
  <button class="side-btn" id="launchBtn">
    <span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round"><path d="M8.4 12.5 4 11l2.2-2.6 3.1.4"/><path d="M7.5 11.6c1.6-4 4.6-7 8.9-8.1.4 4.4-2.1 7.9-5.3 10.2z"/><path d="M7.5 15.6 4.4 16l.4-3.1"/></svg></span>连接工具
  </button>
  <div class="label">对话记录</div>
  <div id="chats"></div>
  <button class="side-btn" id="openLog">
    <span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3" width="13" height="14" rx="2"/><line x1="6.5" y1="7" x2="13.5" y2="7"/><line x1="6.5" y1="10" x2="13.5" y2="10"/><line x1="6.5" y1="13" x2="11" y2="13"/></svg></span>运行日志
  </button>
  <div class="foot" id="apiFoot"></div>
</nav>
<div id="main">
  <div id="bar">
    <button class="icon-btn" id="toggleOut" title="Show sidebar">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <rect x="2.2" y="3.4" width="15.6" height="13.2" rx="2.6"/>
        <line x1="7.9" y1="3.4" x2="7.9" y2="16.6"/>
      </svg>
    </button>
    <span id="moduleTitle">本地助手</span>
    <span id="status"><span id="statusText">connecting…</span><span id="dot"></span></span>
  </div>
  <div id="log" class="empty">
    <div id="hero"><span class="hero-eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.8 12s3.5-5.1 9.2-5.1 9.2 5.1 9.2 5.1-3.5 5.1-9.2 5.1S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span><h1>今天想创作什么？</h1><span class="t">聊天、图片、音乐和视频，都在同一个对话里完成</span><div class="suggestions"><button class="suggestion" onclick="useSuggestion(this)">帮我把想法整理成一段提示词</button><button class="suggestion" onclick="useSuggestion(this,'image')">生成一张雨夜上海街头的电影感画面</button><button class="suggestion" onclick="useSuggestion(this,'music')">创作一首温暖的木吉他流行歌</button><button class="suggestion" onclick="useSuggestion(this,'video')">生成晨雾森林里小鹿穿过阳光的视频</button></div></div>
  </div>
  <div id="launch">
    <div class="wrap">
      <h2>Launch</h2>
      <div class="sub">复制命令到终端运行；编码工具会通过 Mira 本地桥接服务使用当前模型。</div>
      <div id="cards"></div>
    </div>
  </div>
  <div id="composer">
    <div id="card">
      <div id="thumbs"></div>
      <textarea id="input" rows="1" placeholder="发送消息…"></textarea>
      <div id="tools">
        <button class="round" id="attach" title="Attach image">＋</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <span class="agent-mode">Agent · 自动选择能力</span>
        <button id="think" title="Let the model think before answering">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2a4.3 4.3 0 0 0-4.3 4.3c0 1.2.5 2.2 1.3 3 .5.5.8 1.1.8 1.8v.7h4.4v-.7c0-.7.3-1.3.8-1.8a4.2 4.2 0 0 0 1.3-3A4.3 4.3 0 0 0 10 3.2z"/><line x1="8.2" y1="16.4" x2="11.8" y2="16.4"/></svg>
          Think
        </button>
        <span class="shortcut send-shortcut">Enter 换行 · ⌘↵ 发送</span>
        <div id="picker">
          <button id="pickerBtn"><span class="name">Select a model</span><span class="caret">▾</span></button>
          <div id="menu">
            <input id="find" placeholder="Find model…">
            <div id="list"></div>
          </div>
        </div>
        <button id="send" title="Send">↑</button>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let model = null, images = [], messages = [], busy = false, switching = false, variants = [];
let lastTps = 0;  // tokens/s reported by the server for the request in flight
let ready = false, lastHealth = {};

/* ---------- sidebar + chat history ---------- */
const HERO = '<div id="hero"><span class="hero-eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.8 12s3.5-5.1 9.2-5.1 9.2 5.1 9.2 5.1-3.5 5.1-9.2 5.1S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span><h1>今天想创作什么？</h1><span class="t">聊天、图片、音乐和视频，都在同一个对话里完成</span><div class="suggestions"><button class="suggestion" onclick="useSuggestion(this)">帮我把想法整理成一段提示词</button><button class="suggestion" onclick="useSuggestion(this,\'image\')">生成一张雨夜上海街头的电影感画面</button><button class="suggestion" onclick="useSuggestion(this,\'music\')">创作一首温暖的木吉他流行歌</button><button class="suggestion" onclick="useSuggestion(this,\'video\')">生成晨雾森林里小鹿穿过阳光的视频</button></div></div>';
function useSuggestion(button) {
  const input = $("input"); input.value = button.textContent; input.focus();
  input.dispatchEvent(new Event("input"));
}
let chats = [], curId = null;
const activeAgentRequests = new Set();

function setSidebar(hidden) {
  $("side").classList.toggle("hidden", hidden);
  document.body.classList.toggle("side-hidden", hidden);
  localStorage.setItem("argus.side", hidden ? "hidden" : "shown");
}
setSidebar(localStorage.getItem("argus.side") === "hidden");
$("toggleIn").onclick = () => setSidebar(true);
$("toggleOut").onclick = () => setSidebar(false);
$("openLog").onclick = () => fetch("/argus/openlog", {method: "POST"});

/* thinking toggle — sent per request, no server restart needed */
let thinking = localStorage.getItem("argus.thinking") === "on";
function paintThink() { $("think").classList.toggle("on", thinking); }
$("think").onclick = () => {

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem("argus.chats") || "[]");
    chats = Array.isArray(saved) ? saved : [];
  } catch { chats = []; }
}
function titleMatchesKind(title, kind) {
  const words = {
    image: /图片|图像|画|照片|image/i,
    music: /歌|音乐|歌曲|配乐|music|song/i,
    video: /视频|影片|动画|video/i,
  };
  return words[kind]?.test(title || "");
}
async function recoverUnlinkedTasks() {
  try {
    const tasks = await fetch("/mira/jobs").then(r => r.json());
    const linked = new Set(chats.flatMap(c => c.messages.flatMap(m => m.tasks || [])));
    let changed = false;
    for (const task of tasks) {
      if (linked.has(task.id)) continue;
      const createdMs = Number(task.created) * 1000;
      const candidate = chats.find(c => {
        const last = c.messages[c.messages.length - 1];
        const chatMs = Number(c.id);
        return last?.role === "user" && !last.requestId && titleMatchesKind(c.title, task.kind)
          && Number.isFinite(chatMs) && createdMs >= chatMs - 30_000
          && createdMs - chatMs < 10 * 60_000;
      });
      if (!candidate) continue;
      candidate.messages.push({role:"assistant", content:"已恢复后台生成任务。",
                               tasks:[task.id], status:"complete"});
      linked.add(task.id); changed = true;
    }
    if (changed) { saveChats(); renderChats(); if (curId) openChat(curId); }
  } catch { /* task service may still be starting */ }
}
function saveChats() {
  // data: URLs from screenshots can exceed localStorage's small quota and used
  // to make send() throw before the request even left the browser. Keep full
  // images in the live conversation, but persist a text-safe history.
  const compact = chats.slice(0, 50).map(c => ({...c, messages: c.messages.map(m => ({
    ...m,
    content: Array.isArray(m.content)
      ? m.content.filter(p => p.type !== "image_url")
      : m.content,
  }))}));
  while (compact.length) {
    try {
      localStorage.setItem("argus.chats", JSON.stringify(compact));
      return;
    } catch { compact.pop(); }
  }
  try { localStorage.removeItem("argus.chats"); } catch { /* storage unavailable */ }
}
function chatTitle(msgs) {
  const first = msgs.find(m => m.role === "user");
  if (!first) return "New chat";
  const t = typeof first.content === "string"
    ? first.content
    : (first.content.find(p => p.type === "text")?.text || "Image");
  return t.slice(0, 40) || "Image";
}
function renderChats() {
  const box = $("chats");
  box.innerHTML = "";
  for (const c of chats) {
    const row = document.createElement("div");
    row.className = "chat-row" + (c.id === curId ? " cur" : "");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = c.title;
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = e => {
      e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      saveChats();
      if (c.id === curId) newChat();
      else renderChats();
    };
    row.append(t, del);
    row.onclick = () => openChat(c.id);
    box.append(row);
  }
}
function persistCurrent() {
  if (!messages.length) return;
  const title = chatTitle(messages);
  const existing = chats.find(c => c.id === curId);
  if (existing) {
    existing.messages = messages;
    existing.title = title;
    chats = [existing, ...chats.filter(c => c.id !== curId)];
  } else {
    curId = curId || String(Date.now());
    chats.unshift({id: curId, title, messages});
  }
  saveChats();
  renderChats();
}
function newChat() {
  $("moduleTitle").textContent = "本地助手";
  messages = [];
  curId = null;
  images = [];
  $("thumbs").innerHTML = "";
  $("log").innerHTML = HERO;
  $("log").classList.add("empty");
  renderChats();
  $("input").focus();
}
function showChat() {
  document.body.classList.remove("launching");
  $("moduleTitle").textContent = "本地助手";
}
function openChat(id) {
  const c = chats.find(x => x.id === id);
  if (!c) return;
  document.body.classList.remove("launching");
  $("moduleTitle").textContent = "本地助手";
  curId = id;
  messages = c.messages;
  $("log").innerHTML = "";
  $("log").classList.remove("empty");
  for (const m of messages) {
    const imgs = Array.isArray(m.content)
      ? m.content.filter(p => p.type === "image_url").map(p => p.image_url.url) : [];
    const text = typeof m.content === "string"
      ? m.content : (m.content.find(p => p.type === "text")?.text || "");
    const b = bubble(m.role === "user" ? "user" : "bot", text, imgs);
    if (m.kind) {
      const card = document.createElement("div"); card.className = "media-card"; b.append(card);
      if (m.status === "complete") renderMedia(card, m);
      else if (m.status === "running") resumeMedia(m, card);
      else card.textContent = `生成失败：${m.error || "任务未完成"}`;
    }
    for (const taskId of (m.tasks || [])) renderTaskCard(b, taskId);
    if (m.status === "planning" && m.requestId) runAgentRequest(m, b, id);
  }
  renderChats();
}
$("newChat").onclick = () => { showChat(); newChat(); };
loadChats();
renderChats();
recoverUnlinkedTasks();

async function mediaJson(url, options) {
  const r = await fetch(url, options);
  const body = await r.json();
  if (!r.ok) throw Error(body.error || `HTTP ${r.status}`);
  return body;
}
function mediaPost(kind, action, body={}) {
  return mediaJson(`/mira/${kind}/${action}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
}
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function runMedia(mode, prompt, record, bubbleEl, resume=false) {
  const started = record.startedAt || Date.now();
  record.startedAt = started;
  const card = resume ? bubbleEl : document.createElement("div");
  card.className = "media-card";
  card.innerHTML = "";
  const title = document.createElement("div"); title.className = "media-title";
  title.textContent = resume ? "正在恢复生成任务" : ({image:"正在生成图片", music:"正在生成音乐", video:"正在生成视频"})[mode];
  const progress = document.createElement("div"); progress.className = "media-progress";
  const bar = document.createElement("progress"); const label = document.createElement("span");
  bar.removeAttribute("value"); label.textContent = "正在启动本地模型…"; progress.append(bar,label); card.append(title,progress);
  if (!resume) bubbleEl.append(card);
  try {
    if (!resume) {
      let payload;
      if (mode === "image") payload = {prompt, size:$("imageSize").value, steps:4};
      if (mode === "music") payload = {prompt, lyrics:$("lyrics").value.trim(), duration_seconds:+$("musicDuration").value};
      if (mode === "video") {
        const [width,height] = $("videoSize").value.split("x").map(Number);
        payload = {prompt,width,height,frames:+$("videoFrames").value,steps:6,seed:6};
      }
      try {
        const accepted = await mediaPost(mode, "generate", payload);
        record.jobId = accepted.job_id;
      } catch (e) {
        if (!/not prepared|尚未准备/i.test(e.message)) throw e;
        label.textContent = "首次使用，正在下载模型…";
        await mediaPost(mode, "prepare", {accept_license:true});
        for (;;) {
          const s = await mediaJson(`/mira/${mode}/status`);
          if (s.error) throw Error(s.error);
          if (s.model_ready && !s.running) break;
          if (s.download?.percent != null) { bar.value=s.download.percent; bar.max=100; label.textContent=`下载模型 ${s.download.percent}%`; }
          await delay(2000);
        }
        bar.removeAttribute("value");
        const accepted = await mediaPost(mode, "generate", payload);
        record.jobId = accepted.job_id;
      }
      saveChats();
    }
    for (;;) {
      const s = await mediaJson(`/mira/${mode}/status`);
      if (s.error) throw Error(s.error);
      if (record.jobId && s.job_id && record.jobId !== s.job_id) throw Error("该生成任务已被另一项任务替换");
      if (!record.jobId && s.job_id) { record.jobId = s.job_id; saveChats(); }
      if (s.progress?.total) { bar.max=s.progress.total; bar.value=s.progress.step; }
      label.textContent = `${s.stage === "generating" ? "正在生成" : "正在处理"}… ${Math.round((Date.now()-started)/1000)} 秒`;
      if (!s.running) {
        let output = s.output;
        if (!output || (mode === "video" && output.startsWith("/") && !output.startsWith("/outputs/"))) {
          const list = await mediaJson(`/mira/${mode}/${mode === "video" ? "outputs" : "list"}`);
          const item = list[0]; output = typeof item === "string" ? `/files/${encodeURIComponent(item)}` : item?.url;
        }
        if (!output) throw Error("任务结束，但没有找到输出文件");
        record.url = output.startsWith("http") ? output : `http://127.0.0.1:${mode === "video" ? 9877 : mode === "music" ? 9879 : 9880}${output}`;
        record.status = "complete"; record.elapsed = Math.round((Date.now()-started)/1000);
        saveChats(); renderChats(); renderMedia(card, record); return;
      }
      await delay(2000);
    }
  } catch (e) {
    record.status = "failed"; record.error = e.message; saveChats(); renderChats();
    card.textContent = `生成失败：${e.message}`; card.classList.add("notice");
  }
}

function resumeMedia(record, card) {
  card.textContent = "正在重新连接后台生成任务…";
  runMedia(record.kind, record.prompt || "", record, card, true);
}

function renderMedia(container, record) {
  container.innerHTML = "";
  const title = document.createElement("div"); title.className="media-title";
  title.textContent = ({image:"生成的图片",music:"生成的音乐",video:"生成的视频"})[record.kind] + (record.elapsed ? ` · ${record.elapsed} 秒` : "");
  container.append(title);
  if (record.kind === "image") { const el=document.createElement("img"); el.className="generated-image"; el.src=record.url; container.append(el); }
  if (record.kind === "music") { const el=document.createElement("audio"); el.controls=true; el.preload="metadata"; el.src=record.url; container.append(el); }
  if (record.kind === "video") { const el=document.createElement("video"); el.controls=true; el.preload="metadata"; el.src=record.url; container.append(el); }
  const actions=document.createElement("div"); actions.className="media-actions";
  const download=document.createElement("button"); download.className="media-download";
  download.textContent="下载到“下载/Mira”";
  download.onclick=async()=>{
    download.disabled=true; download.textContent="正在保存…";
    try {
      const result=await mediaJson("/mira/media/download", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:record.kind,url:record.url})});
      download.textContent="已保存并在 Finder 中显示"; download.title=result.path;
    } catch(e) { download.disabled=false; download.textContent=`下载失败：${e.message}`; }
  };
  actions.append(download); container.append(actions);
}

const TASK_LABELS={image:"图片",music:"音乐",video:"视频"};
const TASK_STATES={queued:"排队中",running:"生成中",paused:"已暂停",complete:"已完成",failed:"失败",cancelled:"已取消"};
async function taskAction(id, action) {
  await mediaJson(`/mira/jobs/${id}/${action}`, {method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
}
async function renderTaskCard(parent, id) {
  const card=document.createElement("div"); card.className="task-card"; parent.append(card);
  async function refresh(){
    try {
      const task=await mediaJson(`/mira/jobs/${id}`);
      card.innerHTML="";
      const head=document.createElement("div"); head.className="task-head";
      head.append(document.createTextNode(`${TASK_LABELS[task.kind] || task.kind}批任务 · ${task.total} 项`));
      const state=document.createElement("span"); state.className="task-state";
      let stateText=TASK_STATES[task.status] || task.status;
      if(task.status==="running"){
        const elapsed=Math.max(0,Math.round(Date.now()/1000-task.updated));
        stateText+=elapsed<60?` · ${elapsed} 秒`:` · ${Math.floor(elapsed/60)} 分 ${elapsed%60} 秒`;
      }
      state.textContent=stateText; head.append(state); card.append(head);
      const row=document.createElement("div"); row.className="task-progress";
      const bar=document.createElement("progress"); bar.max=task.total; bar.value=task.completed+task.failed;
      const count=document.createElement("span"); count.textContent=`${task.completed}/${task.total}`+(task.failed?` · ${task.failed} 失败`:""); row.append(bar,count); card.append(row);
      const completed=(task.items || []).filter(item=>item.status==="complete" && item.output).slice(-3);
      for(const item of completed){
        const out=document.createElement("div"); out.className="task-output"; card.append(out);
        renderMedia(out,{kind:task.kind,url:item.output});
      }
      if(!["complete","failed","cancelled"].includes(task.status)){
        const actions=document.createElement("div"); actions.className="task-actions";
        const pause=document.createElement("button"); pause.className="media-download";
        pause.textContent=task.status==="paused"?"继续":"暂停";
        pause.onclick=async()=>{await taskAction(id,task.status==="paused"?"resume":"pause");refresh();};
        const cancel=document.createElement("button"); cancel.className="media-download"; cancel.textContent="取消剩余任务";
        cancel.onclick=async()=>{await taskAction(id,"cancel");refresh();};
        actions.append(pause,cancel); card.append(actions);
        setTimeout(refresh,3000);
      }
    } catch(e) { card.textContent=`任务状态读取失败：${e.message}`; }
  }
  refresh();
}

/* ---------- model picker ---------- */
function shortName(id) { return id.split("/").pop(); }

function optionRow(v) {
  const el = document.createElement("div");
  el.className = "opt" + (v.id === model ? " cur" : "");
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = v.label;
  const mark = document.createElement("span");
  mark.className = "mark";
  mark.textContent = v.downloaded ? "✓" : "⤓";

  el.title = v.downloaded ? v.id : v.id + " (not on disk yet — switching downloads it)";
  el.onclick = () => { $("menu").classList.remove("open"); switchModel(v.id); };
  return el;
}

function sectionLabel(text) {
  const el = document.createElement("div");
  el.className = "opt-label";
  el.textContent = text;
  return el;
}

let searchTimer = null;

function renderList(filter = "") {
  const list = $("list");
  list.innerHTML = "";
  const f = filter.trim().toLowerCase();
  const local = variants.filter(v => v.label.toLowerCase().includes(f) || v.id.toLowerCase().includes(f));
  for (const v of local) list.append(optionRow(v));
  if (!local.length && f) list.append(sectionLabel("nothing local matches"));

  // any model mlx-vlm can load works — search Hugging Face for MLX conversions
  clearTimeout(searchTimer);
  if (f.length >= 2) {
    searchTimer = setTimeout(async () => {
      const pending = sectionLabel("searching Hugging Face…");
      list.append(pending);
      let results = [];
      try {
        results = (await fetch(`/argus/search?q=${encodeURIComponent(f)}`).then(r => r.json())).results;
      } catch { /* offline: local list still works */ }
      pending.remove();
      if (!results.length) return;
      list.append(sectionLabel("on Hugging Face"));
      const known = new Set(variants.map(v => v.id));
      for (const v of results.filter(r => !known.has(r.id)).slice(0, 12)) list.append(optionRow(v));
    }, 350);
  }
}

function setPickerLabel() {
  const v = variants.find(v => v.id === model);
  $("pickerBtn").querySelector(".name").textContent = v ? v.label : (model ? shortName(model) : "Select a model");
}

$("pickerBtn").onclick = e => {

  if (m.classList.contains("open")) { $("find").value = ""; renderList(); $("find").focus(); }
};

$("menu").onclick = e => e.stopPropagation();

async function loadModels() {
  const info = await fetch("/argus/models").then(r => r.json());
  variants = info.variants;
  if (!model) model = info.current;
  setPickerLabel();
  // keep an already-open menu in sync (it can be opened before this first load lands)
  if ($("menu").classList.contains("open")) renderList($("find").value);
}

async function switchModel(target) {
  if (target === model) return;
  if (busy) {
    const notice = bubble("bot", "Stop the current reply before switching models.");
    notice.classList.add("notice");
    return;
  }
  const previous = model;
  switching = true;
  ready = false;
  model = target;
  setPickerLabel();
  $("dot").classList.remove("ok");
  $("statusText").textContent = "restarting…";
  bubble("bot", `Switching to ${shortName(target)} — restarting the server` +
    (variants.find(v => v.id === target)?.downloaded ? "…" : " and downloading the model (this can take a while)…"));
  try {
    const resp = await fetch("/argus/use", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({model: target})});
    if (!resp.ok) throw new Error((await resp.json()).error || `HTTP ${resp.status}`);
  } catch (err) {
    switching = false;
    model = previous;
    setPickerLabel();
    const notice = bubble("bot", `Could not switch models: ${err.message}`);
    notice.classList.add("notice");
  }
}

/* ---------- status ---------- */
async function pollReady() {
  let h;
  try {
    h = await fetch("/argus/health").then(r => r.json());
    lastHealth = h;
  } catch {
    $("dot").classList.remove("ok");
    $("statusText").textContent = "interface offline";
    return;
  }
  const targetReady = h.ready && (!switching || h.model === model);
  if (targetReady) {
    if (!switching) model = h.model;
    else if (h.model === model) switching = false;
    $("dot").classList.add("ok");
    $("statusText").textContent = busy
      ? (lastTps ? `generating… ${lastTps.toFixed(1)} tok/s` : "generating…")
      : "ready";
    setPickerLabel();
  } else {
    // process alive but not answering = downloading/loading weights, or busy for us
    $("dot").classList.toggle("ok", busy && h.alive);
    $("statusText").textContent = busy ? "generating…" : startupText(h);
  }
  ready = !!targetReady;
  const apiHost = h.api_host === "0.0.0.0" ? location.hostname : h.api_host;
  if (h.api_port) $("apiFoot").textContent = `http://${apiHost}:${h.api_port}/v1`;
}

function startupText(h) {
  if (h.stage === "failed") return h.error || "服务启动失败，请查看 Mira 日志";
  if (!h.alive) return "server stopped";
  if (h.stage === "downloading") {
    const pct = h.percent != null ? ` ${h.percent}%` : "";
    const of = h.total_gb ? ` · ${h.downloaded_gb}/${h.total_gb} GB` : "";
    return `downloading model${pct}${of}`;
  }
  if (h.stage === "loading") return "loading model into memory…";
  return switching ? "restarting…" : "starting…";
}
loadModels().then(pollReady).catch(() => pollReady());
setInterval(() => { loadModels().catch(() => {}); pollReady(); }, 5000);

/* ---------- images ---------- */
function addImage(dataURL) {
  images.push(dataURL);
  const t = document.createElement("div");
  t.className = "thumb";
  const img = document.createElement("img");
  img.src = dataURL;
  const x = document.createElement("button");
  x.textContent = "✕";
  x.onclick = () => { images.splice(images.indexOf(dataURL), 1); t.remove(); };
  t.append(img, x);
  $("thumbs").append(t);
}
function fileToImage(f) {
  if (!f || !f.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = () => addImage(r.result);
  r.readAsDataURL(f);
}
$("attach").onclick = () => $("file").click();
$("file").onchange = e => { [...e.target.files].forEach(fileToImage); e.target.value = ""; };
document.addEventListener("paste", e => [...e.clipboardData.items].forEach(it => {
  if (it.type.startsWith("image/")) fileToImage(it.getAsFile());
}));
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
document.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("drag");
  [...e.dataTransfer.files].forEach(fileToImage);
});

/* ---------- chat ---------- */
function bubble(role, text, imgs) {
  const log = $("log");
  if (log.classList.contains("empty")) { log.classList.remove("empty"); log.innerHTML = ""; }
  const m = document.createElement("div");
  m.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  (imgs || []).forEach(src => { const i = document.createElement("img"); i.src = src; b.append(i); });
  b.append(document.createTextNode(text));
  m.append(b);
  log.append(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showAgentWaiting(b) {
  b.innerHTML = "";
  const wait = document.createElement("span");
  wait.className = "waiting";
  wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="stage">Agent 正在理解请求并选择能力</span><span class="secs">0 秒</span>';
  b.append(wait);
  const started = Date.now();
  const tick = setInterval(() => {
    const elapsed = Math.round((Date.now() - started) / 1000);
    const secs = wait.querySelector(".secs");
    if (secs) secs.textContent = `${elapsed} 秒`;
    if (!wait.isConnected) clearInterval(tick);
  }, 500);
  return () => { clearInterval(tick); wait.remove(); };
}

async function runAgentRequest(record, b, chatId) {
  const stopWaiting = showAgentWaiting(b);
  if (activeAgentRequests.has(record.requestId)) return;
  activeAgentRequests.add(record.requestId);
  busy = true; $("send").disabled = true;
  const chat = chats.find(c => c.id === chatId);
  const apiMessages = (chat?.messages || []).filter(m =>
    m.status !== "planning" && !m.kind && !m.mode
  ).map(m => ({role:m.role, content:m.content}));
  const started = Date.now();
  try {
    const resp = await fetch("/mira/agent", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: apiMessages, enable_thinking: thinking,
                           request_id: record.requestId}),
    });
    if (!resp.ok) {
      const failure = await resp.json();
      throw new Error(failure.error || `HTTP ${resp.status}`);
    }
    const result = await resp.json();
    record.content = result.content || "任务已处理。";
    record.tasks = result.tasks || [];
    record.status = "complete";
    record.elapsed = ((Date.now() - started) / 1000).toFixed(1);
  } catch (err) {
    record.content = "⚠ " + err.message;
    record.status = "failed";
  } finally {
    stopWaiting();
    activeAgentRequests.delete(record.requestId);
    saveChats(); renderChats();
    busy = false; $("send").disabled = false;
    if (curId === chatId) openChat(chatId);
    $("input").focus();
  }
}

async function sendMedia(mode, text) {
  if (busy || !text) return;
  busy = true; $("send").disabled = true;
  const imgs = images.slice(); images = []; $("thumbs").innerHTML = "";
  $("input").value = ""; $("input").style.height = "auto";
  bubble("user", text, imgs);
  const user = {role:"user", content:text, mode};
  const record = {role:"assistant", content:"", kind:mode, status:"running", prompt:text};
  messages.push(user, record); persistCurrent();
  const b = bubble("bot", "");
  await runMedia(mode, text, record, b);
  busy = false; $("send").disabled = false; $("input").focus();
}

async function send() {
  const text = $("input").value.trim();
  if (busy || (!text && !images.length) || !model) return;
  // don't fire into a server that is still downloading or loading — say what it's doing
  if (!ready) {
    await pollReady();
    if (!ready) {
      const stale = lastHealth.stale_gb > 1
        ? ` (${lastHealth.stale_gb} GB of superseded partials will be cleaned automatically)` : "";
      const b = bubble("bot", `The model isn't ready yet — ${startupText(lastHealth)}.` + stale +
        ` Your message is still in the box; send it once the dot turns green.`);
      b.classList.add("notice");
      return;
    }
  }
  busy = true; $("send").disabled = true;
  const imgs = images.slice();
  images = []; $("thumbs").innerHTML = "";
  $("input").value = ""; $("input").style.height = "auto";
  bubble("user", text, imgs);
  const content = imgs.length
    ? [...imgs.map(u => ({type: "image_url", image_url: {url: u}})), {type: "text", text: text || "Describe this image."}]
    : text;
  const requestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
  messages.push({role: "user", content, requestId});
  persistCurrent();
  const chatId = curId;
  const record = {role:"assistant", content:"", tasks:[], status:"planning", requestId};
  messages.push(record);
  persistCurrent();
  const b = bubble("bot", "");
  await runAgentRequest(record, b, chatId);
}
$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 200) + "px";
});
$("input").focus();
</script>
