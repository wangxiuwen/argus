name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: make dist VERSION="${RELEASE_TAG#v}"

      - name: Verify the archive contains what it should
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          tar -tzf dist/*.tar.gz > files.txt
          for want in ./Mira.app/Contents/Info.plist ./Mira.app/Contents/MacOS/Mira \
                      ./Mira.app/Contents/Helpers/vpipe \
                      ./Mira.app/Contents/Helpers/mlx-serve/mlx-serve \
                      ./bin/argus ./share/chat.py ./share/ui.py ./share/ui.html \
                      ./share/settings.html ./share/bridge.py ./share/launch.py \
                      ./share/prune.py ./share/video.py ./share/music.py \
                      ./share/image.py ./install.sh ./README.md ./LICENSE; do
            grep -qx "$want" files.txt || { echo "missing $want"; exit 1; }
          done
          VERSION="${RELEASE_TAG#v}"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - \
            .build/stage/Mira.app/Contents/Info.plist)"
          test "$BUNDLE_VERSION" = "$VERSION" || {
            echo "bundle version $BUNDLE_VERSION does not match $VERSION"; exit 1;
          }
          echo "archive contents ok"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz \
            --title "Mira $TAG" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ### Install

          ```sh
          tar -xzf mira-*-macos-arm64.tar.gz
          ./install.sh
          open ~/Applications/Mira.app
          ```

          Requires an Apple Silicon Mac and [mlx-vlm](https://github.com/Blaizzy/mlx-vlm):
          `uv tool install -p 3.12 mlx-vlm`

          The app is ad-hoc signed, not notarized. `install.sh` clears the quarantine
          flag for you; if you copy the app by hand, run
          `xattr -dr com.apple.quarantine ~/Applications/Mira.app`.
          EOF
          )" || gh release upload "$TAG" dist/*.tar.gz --clobber
